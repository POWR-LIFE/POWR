<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POWR — Partner With Us</title>
  <meta name="description"
    content="Put your brand where the habit lives. POWR members earn points for training we can verify, then spend them with the brands in the vault. Listed in a day; codes delivered by promo pool, Shopify or API." />

  <!-- Fonts — the page renders serif without this; main.jsx only carries CSS, not the font link -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Favicon — see index.html; both shells must carry the same set -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Social Media Meta Tags — the whole reason this file exists. The site is a
       single-page app sharing one index.html head, so a React route cannot give
       a crawler its own og: tags. Vercel serves a matching static file BEFORE it
       applies the SPA rewrite, so /partners is served from here and boots the
       same bundle: crawlers get partner copy, browsers get the React page. -->
  <meta property="og:title" content="POWR — Partner With Us" />
  <meta property="og:description"
    content="Put your brand where the habit lives. POWR members earn points for training we can verify, then spend them with the brands in the vault." />
  <meta property="og:image" content="https://powr.life/powr-logo-black.png" />
  <meta property="og:url" content="https://powr.life/partners" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="POWR — Partner With Us" />
  <meta name="twitter:description"
    content="Put your brand where the habit lives. POWR members earn points for training we can verify, then spend them with the brands in the vault." />
  <meta name="twitter:image" content="https://powr.life/powr-logo-black.png" />
</head>

<body>
  <div id="root"></div>

  <!-- Same entry as index.html: React Router reads the URL and renders PartnersPage -->
  <script type="module" src="/main.jsx"></script>
</body>

</html>
