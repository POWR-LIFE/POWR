<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Opening POWR…</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700&display=swap');
  :root { --gold: #E8D200; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #080808;
    color: #F2F2F2;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .wrap { width: 100%; max-width: 360px; }
  .logo { height: 40px; width: auto; margin: 0 auto 36px; display: block; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 22px;
    border: 3px solid #222; border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 300; letter-spacing: -0.3px; }
  p { margin: 0 0 28px; font-size: 14px; font-weight: 300; color: #888; line-height: 1.6; }
  .stores { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block; text-decoration: none; border-radius: 28px;
    padding: 15px 24px; font-size: 13px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
  }
  .btn-gold { background: var(--gold); color: #080808; }
  .btn-ghost { background: transparent; color: #F2F2F2; border: 1px solid #333; }
  .hint { margin-top: 24px; font-size: 11px; color: #444; font-weight: 300; }
  .hint a { color: #666; text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://wjvvujnicwkruaeibttt.supabase.co/storage/v1/object/public/landing-page-assets/powrlogotext-app.png" alt="POWR">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Opening POWR…</h1>
    <p id="subtitle">If the app doesn't open automatically, get it below.</p>
    <div class="stores">
      <a class="btn btn-gold" id="ios-btn" href="https://apps.apple.com/app/id6766784336" style="display:none;">Download on the App&nbsp;Store</a>
      <a class="btn btn-gold" id="android-btn" href="https://play.google.com/store/apps/details?id=com.powr.life" style="display:none;">Get it on Google&nbsp;Play</a>
    </div>
    <p class="hint">Trouble opening? Visit <a href="https://powr.life">powr.life</a></p>
  </div>

<script>
(function () {
  var APP_SCHEME = 'powr://';
  var IOS_URL = 'https://apps.apple.com/app/id6766784336';
  var ANDROID_PACKAGE = 'com.powr.life';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE;
  var WEB_FALLBACK = 'https://powr.life';

  var ua = navigator.userAgent || navigator.vendor || '';
  var isIOS = (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) && !window.MSStream;
  var isAndroid = /android/i.test(ua);

  // Optional per-CTA target: /app?to=rewards -> powr://rewards
  // Any params other than `to` are forwarded into the deep link, e.g.
  // /app?to=reset-password&code=abc -> powr://reset-password?code=abc
  var params = new URLSearchParams(window.location.search);
  var target = (params.get('to') || '').replace(/^\/+/, '');
  params.delete('to');
  var forwarded = params.toString();
  var query = forwarded ? '?' + forwarded : '';
  var deepLink = APP_SCHEME + target + query;

  function showStore() {
    document.getElementById('spinner').style.display = 'none';
    if (isIOS) {
      document.getElementById('title').textContent = 'Get POWR for iPhone';
      document.getElementById('ios-btn').style.display = 'block';
    } else if (isAndroid) {
      document.getElementById('title').textContent = 'Get POWR for Android';
      document.getElementById('android-btn').style.display = 'block';
    }
  }

  // Desktop / unknown device: nothing to deep-link into — go to the site,
  // which carries both store badges.
  if (!isIOS && !isAndroid) {
    window.location.replace(WEB_FALLBACK);
    return;
  }

  // If the app opens, the page is backgrounded and these fire — cancel the
  // store fallback so we don't bounce an installed user to the store.
  var cancelled = false;
  function cancel() { cancelled = true; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) cancel(); });
  window.addEventListener('pagehide', cancel);
  window.addEventListener('blur', cancel);

  // App not installed -> reveal store buttons (and on iOS, send to the App Store).
  setTimeout(function () {
    if (cancelled || document.hidden) return;
    showStore();
    if (isIOS) window.location.replace(IOS_URL);
  }, 1600);

  if (isAndroid) {
    // Chrome intent:// is the most reliable launcher and bakes in the Play
    // Store fallback if the app can't handle the scheme.
    var intent = 'intent://' + target + query +
      '#Intent;scheme=powr;package=' + ANDROID_PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end';
    window.location.replace(intent);
  } else {
    window.location.replace(deepLink);
  }
})();
</script>
</body>
</html>
